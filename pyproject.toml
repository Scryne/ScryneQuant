[project]
name = "scryne-quant"
version = "0.1.0"
description = "Bir stratejiye güvenilip güvenilemeyeceğini ölçen quant altyapısı"
requires-python = "==3.12.*"
dependencies = [
    "ccxt>=4.5.78",
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.12.0",
    "structlog>=25.5.0",
    "typer>=0.20.0",
]

[project.scripts]
sq = "scryne_quant.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scryne_quant"]

# Python sürümü sabit: K-009 kütüphane sürümlerinin sonuç kaydına yazılmasını istiyor,
# yorum aralığı bırakmak o kaydı belirsizleştirir. uv.lock tam sürümleri kilitler.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: gerçek ağ erişimi gerektirir (varsayılan koşuda atlanmaz, ama ayrılabilir)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ tarihsel kayıt (Proje-Fikri.md dahil), research/ atılacak spike kodu.
# İkisi de biçimlendirilmez: birincisi olduğu gibi kalmalı, ikincisi zaten commit edilmiyor.
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
