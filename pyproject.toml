[project]
name = "scryne-quant"
version = "0.1.0"
description = "Bir stratejiye güvenilip güvenilemeyeceğini ölçen quant altyapısı"
requires-python = "==3.12.*"
dependencies = [
    # aiohttp ccxt'nin bagimliligi ama burada acikca yaziliyor: canli akis
    # (exchange/akis.py) onu dogrudan kullaniyor ve gecisli bir bagimliliga guvenmek,
    # ccxt bir gun HTTP istemcisini degistirdiginde sessizce kirilmak demek.
    "aiohttp>=3.14.3",
    "ccxt>=4.5.78",
    "fastapi>=0.121.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.12.0",
    # requests/urllib3 de ccxt'nin gecisli bagimliligi ama dogrudan kullaniliyor (R1(f), 2026-09-20):
    # imzali.py (Session, Response), binance_arsiv/alfred/funding/turev_rest/cli.testnet (REST),
    # binance.py (urllib3.util.connection IPv4 kancasi). Gecisli bagimliliga guvenmek, ccxt HTTP
    # istemcisini degistirdiginde sessizce kirilmak demek. Alt sinirlar uv.lock'taki surumlerle
    # uyumlu (requests 2.34, urllib3 2.7).
    "requests>=2.32.0",
    "typer>=0.20.0",
    "typesafe-sdk>=0.6.0",
    "urllib3>=2.2.0",
    "uvicorn>=0.40.0",
]
# Cikarilanlar (R1(f), 2026-09-20): `duckdb` — K-011 "sorgu icin DuckDB" diyordu, kodda hicbir
# sorgu DuckDB ile yapilmiyor (0 import; tek atif ortam kaydindaki surum listesiydi);
# `structlog` — 0 import, projede logging cercevesi yok (cikti typer.echo + SQLite olay tablolari).

[project.scripts]
sq = "scryne_quant.cli.main:main"

[dependency-groups]
dev = [
    # FastAPI'nin TestClient'i httpx uzerine kurulu; API testleri icin gerekli,
    # calisma zamaninda degil.
    "httpx>=0.28.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scryne_quant"]

# Python sürümü sabit: K-009 kütüphane sürümlerinin sonuç kaydına yazılmasını istiyor,
# yorum aralığı bırakmak o kaydı belirsizleştirir. uv.lock tam sürümleri kilitler.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: gerçek ağ erişimi gerektirir (varsayılan koşuda atlanmaz, ama ayrılabilir)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ tarihsel kayıt (Proje-Fikri.md dahil), research/ atılacak spike kodu.
# İkisi de biçimlendirilmez: birincisi olduğu gibi kalmalı, ikincisi zaten commit edilmiyor.
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Faz 16'nın kapanmış ölçüm betikleri: metinleri raporlarıyla birlikte donmuş (K-076…K-079
# bu dosyalara atıf yapıyor). Biçim düzeltmesi bile ölçümü "yeniden yazılmış" gösterirdi;
# yeni betik bu istisnadan yararlanamaz — desen ada bağlı.
"tools/faz16_*.py" = ["E501", "E401", "E701", "E702", "B007", "F401", "F841", "I001", "SIM115"]
